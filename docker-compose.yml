services:
  postgres:
    image: postgres:16-alpine
    container_name: ekyc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ekyc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ekyc']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ekyc_postgres_data:/var/lib/postgresql/data

volumes:
  ekyc_postgres_data:
